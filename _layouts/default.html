<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset='utf-8'>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  {% seo %}
  {% include head-custom.html %}
</head>
<body>
  <header>
    <div class="container">
      <a id="a-title" href="{{ '/' | relative_url }}">
        <h1>{{ site.title | default: site.github.repository_name }}</h1>
      </a>
      <h2>{{ site.description | default: site.github.project_tagline }}</h2>
      <section id="downloads">
        {% if site.show_downloads %}
          <a href="{{ site.github.zip_url }}" class="btn">Download as .zip</a>
          <a href="{{ site.github.tar_url }}" class="btn">Download as .tar.gz</a>
        {% endif %}
        <a href="{{ site.github.repository_url }}" class="btn btn-github"><span class="icon"></span>View on GitHub</a>
      </section>
    </div>
  </header>
  <div class="container">
    <section id="main_content">
      {{ content }}
    </section>
    <hr class="content-divider" aria-hidden="true">
  </div>
  {% include footer.html %}
  <a href="#"
     id="back-to-top"
     class="back-to-top"
     aria-label="Back to top"
     title="Back to top">&#8679;</a>
  <script>
    (function () {
      const backToTop = document.getElementById('back-to-top');
      if (!backToTop) return;

      const toggleBackToTop = () => {
        if (window.scrollY > 520) {
          backToTop.classList.add('is-visible');
        } else {
          backToTop.classList.remove('is-visible');
        }
      };

      backToTop.addEventListener('click', (event) => {
        event.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      toggleBackToTop();
      window.addEventListener('scroll', toggleBackToTop, { passive: true });
    })();

    (function () {
      const root = document.querySelector('#post-body');
      if (!root) return;

      const tocLinks = document.querySelectorAll('.post-toc-link[href^="#"]');
      if (!tocLinks.length) return;

      const slugCounts = new Map();
      const slugify = (value) => {
        const base = value
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9\\s-]/g, '')
          .replace(/\\s+/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '') || 'section';

        const count = slugCounts.get(base) || 0;
        slugCounts.set(base, count + 1);
        return count ? `${base}-${count + 1}` : base;
      };

      const headings = Array.from(root.querySelectorAll('h2'));
      headings.forEach((heading) => {
        const desired = slugify(heading.textContent || heading.innerText || 'section');
        if (!heading.id) {
          heading.id = desired;
        }
      });
    })();

    (function () {
      const links = document.querySelectorAll('#main_content a[href]');
      if (!links.length) return;

      links.forEach((link) => {
        const href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) {
          return;
        }

        let resolvedUrl;
        try {
          resolvedUrl = new URL(href, window.location.href);
        } catch (error) {
          return;
        }

        if (resolvedUrl.origin !== window.location.origin) {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer');
        }
      });
    })();

    (function () {
      const blocks = document.querySelectorAll('#main_content pre');
      if (!blocks.length) return;

      const escapeHtml = (value) => value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      const looksLikeEnvBlock = (code) => {
        if (!code) return false;

        const className = code.className || '';
        if (/(^|\\s)language-env(\\s|$)/.test(className)) {
          return true;
        }

        const lines = code.textContent.split('\n');
        let assignmentCount = 0;

        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line || line.startsWith('#')) continue;
          if (/^[A-Z0-9_]+=/.test(line)) {
            assignmentCount += 1;
            continue;
          }
          return false;
        }

        return assignmentCount >= 2;
      };

      const highlightEnvBlock = (code) => {
        const lines = code.textContent.replace(/\n$/, '').split('\n');
        const rendered = lines.map((rawLine) => {
          const trimmed = rawLine.trim();

          if (!trimmed) {
            return '';
          }

          if (trimmed.startsWith('#')) {
            return `<span class="env-comment">${escapeHtml(rawLine)}</span>`;
          }

          const match = rawLine.match(/^([A-Z0-9_]+)(=)(.*)$/);
          if (!match) {
            return escapeHtml(rawLine);
          }

          const [, key, eq, value] = match;
          return [
            `<span class="env-key">${escapeHtml(key)}</span>`,
            `<span class="env-eq">${escapeHtml(eq)}</span>`,
            `<span class="env-value">${escapeHtml(value)}</span>`
          ].join('');
        }).join('\n');

        code.innerHTML = rendered + '\n';
        code.classList.add('is-env-highlighted');
      };

      const copyText = async (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }

        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.setAttribute('readonly', '');
        textArea.style.position = 'absolute';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        const copied = document.execCommand('copy');
        document.body.removeChild(textArea);
        return copied;
      };

      blocks.forEach((block) => {
        if (block.classList.contains('ascii-diagram')) {
          return;
        }

        const code = block.querySelector('code');
        if (looksLikeEnvBlock(code)) {
          highlightEnvBlock(code);
        }

        if (block.parentElement && block.parentElement.classList.contains('code-block-shell')) {
          return;
        }

        const shell = document.createElement('div');
        shell.className = 'code-block-shell';
        block.parentNode.insertBefore(shell, block);
        shell.appendChild(block);

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'code-copy-button';
        button.setAttribute('aria-label', 'Copy code to clipboard');
        button.textContent = 'Copy';
        shell.appendChild(button);

        button.addEventListener('click', async () => {
          const text = block.innerText.replace(/\n$/, '');
          const original = button.textContent;

          try {
            const copied = await copyText(text);
            button.textContent = copied ? 'Copied' : 'Failed';
          } catch (error) {
            button.textContent = 'Failed';
          }

          button.classList.add('is-copied');
          window.setTimeout(() => {
            button.textContent = original;
            button.classList.remove('is-copied');
          }, 1600);
        });
      });
    })();
  </script>
</body>
</html>

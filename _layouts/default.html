<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset='utf-8'>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  {% seo %}
  {% include head-custom.html %}
</head>
<body>
  <header>
    <div class="container">
      <a id="a-title" href="{{ '/' | relative_url }}">
        <h1>{{ site.title | default: site.github.repository_name }}</h1>
      </a>
      <h2>{{ site.description | default: site.github.project_tagline }}</h2>
      <section id="downloads">
        {% if site.show_downloads %}
          <a href="{{ site.github.zip_url }}" class="btn">Download as .zip</a>
          <a href="{{ site.github.tar_url }}" class="btn">Download as .tar.gz</a>
        {% endif %}
        <a href="{{ site.github.repository_url }}" class="btn btn-github"><span class="icon"></span>View on GitHub</a>
      </section>
    </div>
  </header>
  <div class="container">
    <section id="main_content">
      {{ content }}
    </section>
    <hr class="content-divider" aria-hidden="true">
  </div>
  {% include footer.html %}
  <a href="#"
     id="back-to-top"
     class="back-to-top"
     aria-label="Back to top"
     title="Back to top">&#8679;</a>
  <script>
    (function () {
      const backToTop = document.getElementById('back-to-top');
      if (!backToTop) return;

      const toggleBackToTop = () => {
        if (window.scrollY > 520) {
          backToTop.classList.add('is-visible');
        } else {
          backToTop.classList.remove('is-visible');
        }
      };

      backToTop.addEventListener('click', (event) => {
        event.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      toggleBackToTop();
      window.addEventListener('scroll', toggleBackToTop, { passive: true });
    })();

    (function () {
      const links = document.querySelectorAll('#main_content a[href]');
      if (!links.length) return;

      links.forEach((link) => {
        const href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) {
          return;
        }

        let resolvedUrl;
        try {
          resolvedUrl = new URL(href, window.location.href);
        } catch (error) {
          return;
        }

        if (resolvedUrl.origin !== window.location.origin) {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer');
        }
      });
    })();

    (function () {
      const blocks = document.querySelectorAll('#main_content pre');
      if (!blocks.length) return;

      const copyText = async (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }

        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.setAttribute('readonly', '');
        textArea.style.position = 'absolute';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        const copied = document.execCommand('copy');
        document.body.removeChild(textArea);
        return copied;
      };

      blocks.forEach((block) => {
        if (block.parentElement && block.parentElement.classList.contains('code-block-shell')) {
          return;
        }

        const shell = document.createElement('div');
        shell.className = 'code-block-shell';
        block.parentNode.insertBefore(shell, block);
        shell.appendChild(block);

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'code-copy-button';
        button.setAttribute('aria-label', 'Copy code to clipboard');
        button.textContent = 'Copy';
        shell.appendChild(button);

        button.addEventListener('click', async () => {
          const text = block.innerText.replace(/\n$/, '');
          const original = button.textContent;

          try {
            const copied = await copyText(text);
            button.textContent = copied ? 'Copied' : 'Failed';
          } catch (error) {
            button.textContent = 'Failed';
          }

          button.classList.add('is-copied');
          window.setTimeout(() => {
            button.textContent = original;
            button.classList.remove('is-copied');
          }, 1600);
        });
      });
    })();
  </script>
</body>
</html>

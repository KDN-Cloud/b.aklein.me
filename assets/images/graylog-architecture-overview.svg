<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1420" role="img" aria-labelledby="title desc">
  <title id="title">Graylog architecture overview</title>
  <desc id="desc">Architecture overview diagram for a homelab Graylog stack showing lab nodes sending logs to Graylog on Proxmox, OpenSearch storing indexed log data on NFS, MongoDB keeping Graylog configuration locally, a reverse proxy handling the public entrypoint, and a separate pfSense to Synology archive path.</desc>
  <rect width="1700" height="1420" fill="#050705"/>
  <text
    x="24"
    y="44"
    fill="#e9f7e8"
    font-family="Monaco, 'Bitstream Vera Sans Mono', 'Lucida Console', Terminal, monospace"
    font-size="22"
    xml:space="preserve"><tspan x="24" dy="0">┌─────────────────────────────────────────────────────────────┐</tspan><tspan x="24" dy="34">│                        Lab Fleet                            │</tspan><tspan x="24" dy="34">│   linux-node-1 · linux-node-2 · linux-node-3 · pfSense     │</tspan><tspan x="24" dy="34">│           rsyslog TCP → port 5140 (Syslog Input)           │</tspan><tspan x="24" dy="34">│           Docker GELF UDP → port 12201 (GELF Input)        │</tspan><tspan x="24" dy="34">└───────────────────────────┬─────────────────────────────────┘</tspan><tspan x="24" dy="34">                            │</tspan><tspan x="24" dy="34">                            │  all nodes ship logs inward</tspan><tspan x="24" dy="34">                    ┌───────▼────────┐</tspan><tspan x="24" dy="34">                    │  Graylog VM    │  Ubuntu 22.04 on Proxmox</tspan><tspan x="24" dy="34">                    │  10.0.0.x      │  16GB RAM / 8 vCPU</tspan><tspan x="24" dy="34">                    │                │</tspan><tspan x="24" dy="34">                    │  ┌──────────┐  │</tspan><tspan x="24" dy="34">                    │  │ Graylog  │  │  :9000 (UI)</tspan><tspan x="24" dy="34">                    │  │          │  │  :9833 (Prometheus)</tspan><tspan x="24" dy="34">                    │  └────┬─────┘  │  ingest, search, dashboards, streams</tspan><tspan x="24" dy="34">                    │       │        │</tspan><tspan x="24" dy="34">                    │  ┌────▼─────┐  │</tspan><tspan x="24" dy="34">                    │  │OpenSearch│  │  stores and indexes log data</tspan><tspan x="24" dy="34">                    │  └──────────┘  │  ← data/journal → NFS (NAS)</tspan><tspan x="24" dy="34">                    │  ┌──────────┐  │</tspan><tspan x="24" dy="34">                    │  │ MongoDB  │  │  Graylog config, users, streams only</tspan><tspan x="24" dy="34">                    │  └──────────┘  │  ← local named volume</tspan><tspan x="24" dy="34">                    └───────┬────────┘</tspan><tspan x="24" dy="34">                            │</tspan><tspan x="24" dy="34">                            │  public access path</tspan><tspan x="24" dy="34">                    ┌───────▼────────┐</tspan><tspan x="24" dy="34">                    │  Reverse Proxy │  TLS termination + external entrypoint</tspan><tspan x="24" dy="34">                    │  logs.lab.yourdomain.com</tspan><tspan x="24" dy="34">                    └────────────────┘</tspan><tspan x="24" dy="34"></tspan><tspan x="24" dy="34">                    ┌───────────────────────┐</tspan><tspan x="24" dy="34">                    │  pfSense → Synology   │  separate path</tspan><tspan x="24" dy="34">                    │  NAS log archive      │  local firewall retention, no Graylog needed</tspan><tspan x="24" dy="34">                    └───────────────────────┘</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="890" viewBox="0 0 640 890" role="img" aria-labelledby="title desc">
<title id="title">CertFP setup and automatic login verification</title><desc id="desc">Generate a certificate, connect upstream with it, register it with NickServ, reconnect Soju upstream, and verify automatic login before manually identifying again.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}.heading{font-size:28px;font-weight:700}.detail{font-size:22px;fill:#c2ccd7}.label{font-size:24px;fill:#79bdff;font-weight:700}.box{fill:#161e29;stroke:#47566b;stroke-width:2}.arrow{stroke:#79bdff;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#79bdff"/></marker></defs>
<rect width="640" height="890" rx="24" fill="#0d141d"/>
<text x="36" y="52" class="heading">CertFP: register, reconnect, verify</text>
<text x="36" y="88" class="detail">Repeat for each Soju user/network.</text>
<rect x="36" y="120" width="568" height="124" rx="16" class="box"/><text x="58" y="154" class="label">1. Generate the client certificate</text><text x="58" y="191" class="detail">Soju: certfp generate</text><text x="58" y="224" class="detail">Enables upstream SASL EXTERNAL</text><path d="M320 248V266" class="arrow"/>
<rect x="36" y="270" width="568" height="124" rx="16" class="box"/><text x="58" y="304" class="label">2. Connect with that certificate</text><text x="58" y="341" class="detail">Enable the staged Soju network</text><text x="58" y="374" class="detail">Attach Relay to the selected Soju network</text><path d="M320 398V416" class="arrow"/>
<rect x="36" y="420" width="568" height="124" rx="16" class="box"/><text x="58" y="454" class="label">3. Register it with NickServ</text><text x="58" y="491" class="detail">Identify to your IRC account first</text><text x="58" y="524" class="detail">Follow the network’s HELP CERT instructions</text><path d="M320 548V566" class="arrow"/>
<rect x="36" y="570" width="568" height="124" rx="16" class="box"/><text x="58" y="604" class="label">4. Reconnect Soju upstream</text><text x="58" y="641" class="detail">Soju: network update</text><text x="58" y="674" class="detail">Reconnecting only Relay does not do this</text><path d="M320 698V716" class="arrow"/>
<rect x="36" y="720" width="568" height="124" rx="16" class="box"/><text x="58" y="754" class="label">5. Verify automatic account login</text><text x="58" y="791" class="detail">Check SASL status, WHOIS, and logs</text><text x="58" y="824" class="detail">Check before manually identifying again</text>
</svg>

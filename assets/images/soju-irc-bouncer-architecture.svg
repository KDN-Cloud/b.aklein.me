<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010" role="img" aria-labelledby="title desc">
<title id="title">Relay and Soju: two separate IRC connections</title>
<desc id="desc">Relay connects to Soju with TLS and SASL PLAIN using Soju credentials. Soju maintains upstream TLS connections using the IRC account password or client CertFP. Local administration uses sojuctl and the private admin socket.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}.heading{font-size:28px;font-weight:700}.detail{font-size:22px;fill:#c2ccd7}.label{font-size:24px;fill:#79bdff;font-weight:700}.box{fill:#161e29;stroke:#47566b;stroke-width:2}.arrow{stroke:#79bdff;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#79bdff"/></marker></defs>
<rect width="640" height="1010" rx="24" fill="#0d141d"/>
<text x="36" y="52" class="heading">Persistent IRC with Relay + Soju</text>
<text x="36" y="88" class="detail">Two IRC connections. Separate credentials.</text>
<rect x="36" y="120" width="568" height="120" rx="16" class="box"/>
<text x="64" y="162" class="heading">Relay backend</text>
<text x="64" y="200" class="detail">Serves your web, desktop, and mobile clients</text>
<path d="M84 256V366" class="arrow"/>
<text x="120" y="286" class="label">TLS · SASL PLAIN</text>
<text x="120" y="322" class="detail">Soju username/network + Soju password</text>
<text x="120" y="355" class="detail">Reconnects when Relay restarts</text>
<rect x="36" y="388" width="568" height="150" rx="16" fill="#153d68" stroke="#79bdff" stroke-width="2"/>
<text x="64" y="432" class="heading">Soju bouncer</text>
<text x="64" y="469" class="label">Keeps upstream connections alive</text>
<text x="64" y="506" class="detail">Saved networks, joined channels, and backlog</text>
<path d="M84 556V686" class="arrow"/>
<text x="120" y="589" class="label">TLS · upstream authentication</text>
<text x="120" y="626" class="detail">SASL PLAIN: IRC account + password</text>
<text x="120" y="663" class="detail">Or EXTERNAL: registered client CertFP</text>
<rect x="36" y="708" width="568" height="112" rx="16" class="box"/>
<text x="64" y="752" class="heading">IRC networks</text>
<text x="64" y="789" class="detail">Soju stays connected while Relay restarts</text>
<rect x="36" y="858" width="568" height="116" rx="16" class="box"/>
<text x="64" y="899" class="label">Local Soju administration</text>
<text x="64" y="940" class="detail">Soju-TUI → sojuctl → private admin socket</text>
</svg>

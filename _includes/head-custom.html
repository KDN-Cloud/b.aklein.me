<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<meta name="theme-color" content="#081108">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
{% assign page_keywords = page.tags | default: page.keywords | default: site.keywords %}
{% if page_keywords %}
  <meta name="keywords" content="{% if page_keywords.first %}{{ page_keywords | join: ', ' }}{% else %}{{ page_keywords }}{% endif %}">
{% endif %}
{% include schema.html %}

<style>
  #theme-toggle {
    cursor: pointer;
    background: none;
    border: 1px solid currentColor;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 0.8rem;
    color: inherit;
    opacity: 0.6;
    margin-left: 1rem;
  }
  #theme-toggle:hover {
    opacity: 1;
  }
</style>

<script>
  (function() {
    const saved = localStorage.getItem('theme');
    if (saved === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

{% if site.google_analytics and jekyll.environment == 'production' %}
  {% include google-analytics.html %}
{% endif %}
